[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runner*", "sim_eval*", "controller*", "eval*"]

[project]
name = "drone-eval-poc"
version = "0.1.0"
description = "LLM-driven drone controller evaluation PoC"
requires-python = ">=3.11"
dependencies = [
    "coppeliasim-zmqremoteapi-client>=0.4.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
agent-runner = "agent_runner.cli:main"
sim-eval = "sim_eval.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
